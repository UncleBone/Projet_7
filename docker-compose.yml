services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orion-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8080
      - NODE_ENV=production
    volumes:
      - sqlite_data:/app/prisma
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: orion-front
    ports:
      - "4200:4200"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - server
    restart: always

volumes:
  sqlite_data: