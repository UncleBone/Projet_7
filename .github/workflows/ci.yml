name: CI Orion CRM

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important pour SonarCloud

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # On précise les deux dossiers pour le cache
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # --- BACKEND ---
      - name: Install Backend Dependencies
        run: cd server && npm ci

      - name: Prisma Generate
        run: cd server && npx prisma generate

      - name: Backend Lint & Test
        run: |
          cd server
          npm run lint
          npm run test -- --coverage # Génère le rapport pour Sonar

      # --- FRONTEND ---
      - name: Install Frontend Dependencies
        run: cd client && npm ci

      - name: Frontend Lint & Test
        run: |
          cd client
          npm run lint
          npm run test -- --coverage # Génère le rapport pour Sonar

      # --- ANALYSE QUALITÉ & SÉCURITÉ ---
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Backend Security Audit
        run: npm audit --audit-level=high
        working-directory: server

      - name: Frontend Security Audit
        run: npm audit --audit-level=high
        working-directory: client

      # --- BUILD CHECK (Vérification que la compilation fonctionne) ---
      - name: Build Projects
        run: |
          cd server && npm run build
          cd ../client && npm run build

      # --- DOCKER BUILD & SCAN (SÉCURITÉ DES IMAGES) ---
      
      # 1. Préparation de l'image Backend
      - name: Build Backend Docker Image
        run: docker build -t orion-api:${{ github.sha }} ./server

      # 2. Scan de l'image Backend avec Trivy
      - name: Scan Backend Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'orion-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Bloque le pipeline en cas de vulnérabilité
          ignore-unfixed: true # Ignore les failles qui n'ont pas encore de correctif
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # 3. Préparation de l'image Frontend
      - name: Build Frontend Docker Image
        run: docker build -t orion-client:${{ github.sha }} ./client

      # 4. Scan de l'image Frontend avec Trivy
      - name: Scan Frontend Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'orion-client:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'