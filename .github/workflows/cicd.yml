name: CI/CD Orion CRM Optimized

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Tous les jours à 2h du matin

jobs:
  # --- JOB 1 : VALIDATION BACKEND ---
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install & Test Backend
        run: |
          cd server
          npm ci
          npx prisma generate
          npm run lint
          npm run test -- --coverage

  # --- JOB 2 : VALIDATION FRONTEND (Tourne en parallèle du Backend) ---
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install & Test Frontend
        run: |
          cd client
          npm ci
          npm run lint
          npm run test -- --coverage

  # --- JOB 3 : ANALYSE PROFONDE (Qualité & Sécurité) ---
  # Ce job ne se lance que sur 'main' (push ou schedule) pour ne pas ralentir les PR
  security-and-quality:
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Security Audit (NPM)
        run: |
          cd server && npm audit --audit-level=high
          cd ../client && npm audit --audit-level=high

      # On build les images juste pour le scan Trivy
      - name: Build & Scan Docker Images (Trivy)
        run: |
          docker build -t orion-api:scan ./server
          docker build -t orion-client:scan ./client
      
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'orion-api:scan'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'orion-client:scan'
          exit-code: '1'
          severity: 'CRITICAL'

  # --- JOB 4 : PUBLICATION ---
  # Uniquement sur push main, après succès de la sécurité
  publish-images:
    needs: security-and-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/orion-api:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/orion-client:latest